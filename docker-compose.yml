version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ueh-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ueh_smart_credit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ueh_smart_credit"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ueh-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
