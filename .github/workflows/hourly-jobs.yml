name: Hourly Background Jobs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.APP_BASE_URL }}" ]; then
            echo "Missing APP_BASE_URL secret"
            exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Missing CRON_SECRET secret"
            exit 1
          fi

      - name: Run SLA scan
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "${{ secrets.APP_BASE_URL }}/api/jobs/sla-scan" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

      - name: Run match offers
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "${{ secrets.APP_BASE_URL }}/api/jobs/match-offers" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

      - name: Run expire offers
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "${{ secrets.APP_BASE_URL }}/api/jobs/expire-offers" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
